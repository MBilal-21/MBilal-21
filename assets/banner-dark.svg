<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bilal Ashraf — AI Engineer. I turn AI into tools teams use every day.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .node{fill:#58a6ff}
      .pulse{animation:p 3s ease-in-out infinite}
      .d2{animation-delay:1s}.d3{animation-delay:2s}
      @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.7}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- network motif -->
  <g stroke="#58a6ff" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M880 80 L980 140 L1080 90"/>
    <path d="M980 140 L940 220 L1060 210 L1080 90"/>
    <path d="M980 140 L1060 210"/>
  </g>
  <circle class="node pulse" cx="880" cy="80" r="6"/>
  <circle class="node pulse d2" cx="980" cy="140" r="9" fill="#a371f7" style="fill:#a371f7"/>
  <circle class="node pulse d3" cx="1080" cy="90" r="6"/>
  <circle class="node pulse d2" cx="940" cy="220" r="6"/>
  <circle class="node pulse" cx="1060" cy="210" r="7"/>

  <text class="t" x="72" y="118" font-size="56" font-weight="700" fill="#e6edf3">Bilal Ashraf</text>
  <rect x="72" y="138" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text class="t" x="72" y="186" font-size="26" font-weight="600" fill="#58a6ff">AI Engineer · Full Stack Developer</text>
  <text class="t" x="72" y="226" font-size="21" fill="#9da7b3">I turn AI into tools teams use every day.</text>
</svg>
